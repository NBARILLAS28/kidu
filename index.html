<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KIDU: juegos educativos para niños de 3 a 9 años. Colores, memoria, figuras, música, números y letras.">
<title>KIDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  color-scheme: light;
  --sol:#FFF1C9; --sol-2:#FFE39A; --tinta:#2A2150; --tinta-2:#5A4F86;
  --rojo:#FF5A4E; --azul:#3E9BF0; --verde:#34B36A; --amarillo:#FFC53D; --morado:#9B6BE8; --naranja:#FF8A3D;
  --papel:#FFFFFF; --sombra:0 6px 0 rgba(42,33,80,.18);
  --display:"Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background-color:var(--sol);
  background-image:radial-gradient(circle at 1px 1px, rgba(255,138,61,.22) 2px, transparent 2.5px);
  background-size:28px 28px;
  color:var(--tinta); font-family:var(--body); font-size:16px;
  padding-inline:16px; padding-block:14px 32px;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--azul);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1;margin:0;letter-spacing:-.5px}
.brand{flex-direction:column;align-items:flex-start;gap:2px}
.brand h1{font-size:clamp(40px,9vw,58px);letter-spacing:1px;color:var(--tinta)}
.brand h1 .u{display:inline-block;color:var(--rojo);transform:rotate(-8deg) translateY(2px);animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg) translateY(2px)}50%{transform:rotate(6deg) translateY(-2px)}}
.brand .tag{margin:0;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2)}
.brand .tag b{color:var(--rojo)}
.pills{display:flex;gap:8px;align-items:center}
.pill{background:var(--papel);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:var(--sombra);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pill.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,33,80,.18)}

/* selector de edad */
.edad{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edad p{margin:0;font-weight:800;color:var(--tinta-2)}
.seg{display:flex;background:var(--papel);border-radius:999px;padding:5px;box-shadow:var(--sombra)}
.seg button{padding:8px 16px;border-radius:999px;font-weight:800;color:var(--tinta-2)}
.seg button[aria-pressed="true"]{background:var(--tinta);color:#fff}

/* tarjetas de juegos */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{position:relative;text-align:left;border-radius:28px;padding:18px 18px 20px;color:#fff;min-height:170px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;box-shadow:0 8px 0 rgba(42,33,80,.25);transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(42,33,80,.25)}
.tile .ico{position:absolute;top:10px;right:14px;font-size:62px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.tile h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.05}
.tile p{margin:0;font-weight:700;opacity:.95;max-width:22ch}
.tile .skill{align-self:flex-start;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:auto}
.t-rojo{background:var(--rojo)} .t-azul{background:var(--azul)} .t-verde{background:var(--verde)}
.t-amarillo{background:var(--amarillo);color:var(--tinta)} .t-morado{background:var(--morado)}
.t-amarillo .skill{background:rgba(42,33,80,.12)}
.t-naranja{background:var(--naranja)} .t-tinta{background:var(--tinta)}
.t-album{background:var(--papel);color:var(--tinta);grid-column:1/-1;min-height:130px}
.t-album .skill{background:#FFF1C9}
.t-album .ico{font-size:52px}

/* preguntas (números y letras) */
.quiz{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:6px}
.qshow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;font-size:clamp(40px,11vw,64px);line-height:1.1;max-width:520px;min-height:1.2em}
.qshow .sum{font-family:var(--display);font-weight:800;color:var(--tinta);align-self:center;font-size:.8em}
.qshow .one{animation:popin .4s both}
.qword{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,40px);letter-spacing:.06em;margin-top:-10px}
.qword .blank{display:inline-block;min-width:.9em;border-bottom:5px solid var(--rojo);color:var(--rojo);text-align:center}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{width:clamp(78px,22vw,104px);aspect-ratio:1;border-radius:26px;font-family:var(--display);font-weight:800;font-size:clamp(38px,10vw,54px);color:#fff;box-shadow:0 7px 0 rgba(42,33,80,.25)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(42,33,80,.25)}
.opt.ok{background:var(--verde)!important;animation:popin .4s}
.opt.no{opacity:.35}

/* álbum */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stk{aspect-ratio:1;border-radius:24px;background:#FFF7E0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 var(--sol-2)}
.stk .e{font-size:clamp(40px,10vw,54px);line-height:1}
.stk .n{font-weight:800;font-size:13px;color:var(--tinta-2)}
.stk.lock{background:#F1EEF7;box-shadow:0 5px 0 #DCD6EA}
.stk.lock .e{filter:grayscale(1) brightness(.2);opacity:.18}
.stk.new{animation:popin .6s}
.party .sticker{margin:-6px 0 16px;background:#FFF7E0;border-radius:20px;padding:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.party .sticker span{font-size:44px;line-height:1}
.hint{margin:0;text-align:center;color:var(--tinta-2);font-weight:700}

/* pantalla de juego */
.gamebar{display:flex;align-items:center;gap:10px}
.round{width:52px;height:52px;border-radius:50%;background:var(--papel);box-shadow:var(--sombra);display:grid;place-items:center;font-size:24px;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,33,80,.18)}
.gamebar h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,32px);margin:0;flex:1;line-height:1.1;text-wrap:balance}
.instr{background:var(--papel);border-radius:22px;padding:12px 16px;font-weight:800;font-size:clamp(17px,4vw,21px);box-shadow:var(--sombra);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-family:var(--display)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(42,33,80,.14)}
.dot.on{background:var(--verde)}
.stage{background:var(--papel);border-radius:30px;padding:18px;box-shadow:0 8px 0 rgba(42,33,80,.15);position:relative}

/* memoria */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto}
.card{aspect-ratio:1;max-width:100%;perspective:600px}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:var(--azul);background-image:radial-gradient(circle,rgba(255,255,255,.35) 3px,transparent 4px);background-size:18px 18px;box-shadow:0 5px 0 #2B74B8}
.card .b{background:#FFF7E0;transform:rotateY(180deg);font-size:clamp(34px,9vw,58px);box-shadow:0 5px 0 var(--sol-2)}
.card.done .b{background:#DDF6E6;box-shadow:0 5px 0 #9AD9B2}

/* simón */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto}
.pad{aspect-ratio:1;border-radius:32px;opacity:.55;transition:opacity .1s,transform .1s;box-shadow:0 8px 0 rgba(42,33,80,.25)}
.pad.lit{opacity:1;transform:scale(1.05);filter:brightness(1.12)}
.pad:disabled{cursor:default}
.pad:nth-child(1){border-radius:60px 24px 24px 24px}.pad:nth-child(2){border-radius:24px 60px 24px 24px}
.pad:nth-child(3){border-radius:24px 24px 24px 60px}.pad:nth-child(4){border-radius:24px 24px 60px 24px}

/* figuras */
.board,.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.board{padding-bottom:18px;border-bottom:4px dashed rgba(42,33,80,.12);margin-bottom:18px}
.slot{width:clamp(78px,20vw,112px);aspect-ratio:1;border-radius:20px;background:#F6F1FF;display:grid;place-items:center;padding:8px}
.slot.hot{background:#E3F3FF}
.slot svg,.piece svg{width:100%;height:100%;overflow:visible}
.piece{width:clamp(78px,20vw,112px);aspect-ratio:1;padding:8px;touch-action:none;cursor:grab;position:relative;z-index:1}
.piece.drag{z-index:50;cursor:grabbing;filter:drop-shadow(0 12px 8px rgba(0,0,0,.2))}
.piece.back{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.piece.gone{visibility:hidden}
.pop-in{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* globos */
.sky{height:clamp(340px,58vh,560px);border-radius:24px;overflow:hidden;position:relative;
  background:linear-gradient(#BFE6FF,#EAF7FF);touch-action:manipulation}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.balloon{position:absolute;width:74px;height:90px;border-radius:50% 50% 48% 48%/ 55% 55% 45% 45%;
  box-shadow:inset -10px -10px 0 rgba(0,0,0,.12), inset 8px 8px 0 rgba(255,255,255,.3);cursor:pointer;touch-action:manipulation}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:rgba(42,33,80,.35);transform:translateX(-50%)}
.balloon::before{content:"";position:absolute;left:50%;top:97%;width:12px;height:9px;transform:translateX(-50%);background:inherit;clip-path:polygon(50% 0,100% 100%,0 100%)}
.burst{position:absolute;font-family:var(--display);font-weight:800;font-size:28px;pointer-events:none;animation:burst .6s forwards}
@keyframes burst{to{transform:translateY(-40px) scale(1.4);opacity:0}}

/* xilófono */
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.mode{padding:10px 18px;border-radius:999px;background:#F2EEE3;font-weight:800}
.mode[aria-pressed="true"]{background:var(--tinta);color:#fff}
.xylo{display:flex;gap:clamp(4px,1.4vw,10px);align-items:center;justify-content:center;padding-block:10px;
  background:linear-gradient(transparent 30%,#C98A4B 30%,#C98A4B 36%,transparent 36%,transparent 64%,#C98A4B 64%,#C98A4B 70%,transparent 70%)}
.bar{flex:1;max-width:74px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:10px 0;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(14px,3.4vw,20px);box-shadow:0 6px 0 rgba(42,33,80,.25);transition:transform .08s}
.bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7)}
.bar:active,.bar.hit{transform:translateY(4px) scaleY(.98)}
.bar.next{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(42,33,80,.25),0 0 0 0 rgba(255,197,61,.9)}50%{box-shadow:0 6px 0 rgba(42,33,80,.25),0 0 0 10px rgba(255,197,61,0)}}
.lyric{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.5vw,26px);min-height:1.5em;margin-top:12px}
.lyric b{color:var(--rojo)}

/* celebración */
.party{position:fixed;inset:0;background:rgba(42,33,80,.55);display:grid;place-items:center;z-index:100;padding:16px}
.party .box{background:var(--papel);border-radius:34px;padding:28px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.party h3{font-family:var(--display);font-weight:800;font-size:44px;margin:0;color:var(--rojo);line-height:1}
.party .stars{font-size:52px;margin:10px 0 4px;display:flex;justify-content:center;gap:6px}
.party .stars span{animation:popin .5s both}
.party .stars span:nth-child(2){animation-delay:.15s}.party .stars span:nth-child(3){animation-delay:.3s}
.party p{margin:0 0 18px;font-weight:700;color:var(--tinta-2)}
.party .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{padding:14px 22px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;box-shadow:0 5px 0 rgba(42,33,80,.25)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,33,80,.25)}
/* versión completa */
.lockpill{position:absolute;right:14px;bottom:14px;background:rgba(42,33,80,.28);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;display:none}
.t-amarillo .lockpill{background:rgba(42,33,80,.16);color:var(--tinta)}
.tile.locked .lockpill{display:block}
.parents{display:flex;justify-content:center}
.linkbtn{font-weight:800;color:var(--tinta);background:var(--papel);border-radius:999px;padding:10px 18px;box-shadow:var(--sombra)}
.linkbtn.ok{color:var(--verde)}
.party .box.left{text-align:left}
.party .eyebrow{margin:0 0 4px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2)}
.party h4{font-family:var(--display);font-weight:800;font-size:30px;margin:0 0 10px;line-height:1.05;color:var(--tinta)}
.party h4 .u{color:var(--rojo)}
.q-math{font-family:var(--display);font-weight:800;font-size:40px;text-align:center;margin:6px 0 12px;color:var(--tinta)}
.field{width:100%;font:inherit;font-size:22px;font-weight:800;text-align:center;padding:12px;border-radius:16px;border:3px solid #E6E0F2;background:#FBFAFE;color:var(--tinta);outline:none}
.field:focus{border-color:var(--azul)}
.err{color:var(--rojo);font-weight:800;min-height:1.3em;margin:8px 0 0;text-align:center}
.perks{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-weight:700;color:var(--tinta)}
.perks li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:#DDF6E6;color:var(--verde);display:grid;place-items:center;font-weight:800;font-size:14px}
.price{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
.price b{font-family:var(--display);font-size:38px;color:var(--tinta);line-height:1}
.price span{font-weight:700;color:var(--tinta-2)}
.big[disabled]{opacity:.45;cursor:not-allowed}
.sep{display:flex;align-items:center;gap:10px;color:var(--tinta-2);font-weight:800;font-size:13px;margin:16px 0 10px}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:#EEE9F6}
.row{display:flex;gap:8px}
.row .field{font-size:17px;text-transform:uppercase;letter-spacing:.06em}
.row .big{flex:none;font-size:16px;padding:12px 16px}
.x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:50%;background:#F2EEF8;font-size:18px}
.party .box{position:relative}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:101}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <!-- INICIO -->
  <section id="home" class="wrap" style="gap:18px">
    <div class="top">
      <div class="brand"><h1 aria-label="KIDU">KID<span class="u">U</span></h1><p class="tag">Kid + <b>you</b> · juegos para ti</p></div>
      <div class="pills">
        <div class="pill" aria-label="Estrellas ganadas">⭐ <span id="starCount">0</span></div>
        <button class="pill btn" id="soundBtn" aria-label="Sonido">🔊</button>
      </div>
    </div>
    <div class="edad">
      <p>¿Cuántos años tienes?</p>
      <div class="seg" role="group" aria-label="Edad">
        <button data-age="peque" aria-pressed="true">3 a 5 años</button>
        <button data-age="grande" aria-pressed="false">6 a 9 años</button>
      </div>
    </div>
    <div class="grid">
      <button class="tile t-rojo" data-game="globos"><span class="skill">Colores</span><span class="ico">🎈</span><h2>Globos</h2><p>Revienta los globos del color que te pido.</p></button>
      <button class="tile t-azul" data-game="memoria"><span class="skill">Memoria</span><span class="ico">🐶</span><h2>Parejas</h2><p>Voltea cartas y encuentra los animalitos iguales.</p></button>
      <button class="tile t-verde" data-game="simon"><span class="skill">Colores y sonidos</span><span class="ico">🟢</span><h2>Repite la luz</h2><p>Mira los colores que se encienden y repítelos.</p></button>
      <button class="tile t-amarillo" data-game="figuras"><span class="skill">Rompecabezas</span><span class="ico">⭐</span><h2>Figuras</h2><p>Arrastra cada figura a su sombra.</p></button>
      <button class="tile t-morado" data-game="xilofono"><span class="skill">Música</span><span class="ico">🎵</span><h2>Xilófono</h2><p>Toca notas libres o aprende “Estrellita”.</p></button>
      <button class="tile t-naranja" data-game="numeros"><span class="skill">Números</span><span class="ico">🍎</span><h2>¿Cuántos hay?</h2><p>Cuenta las frutas y toca el número correcto.</p></button>
      <button class="tile t-tinta" data-game="letras"><span class="skill">Letras</span><span class="ico">🔤</span><h2>¿Con qué letra?</h2><p>Descubre con qué letra empieza cada palabra.</p></button>
      <button class="tile t-album" data-game="album"><span class="skill">Premios</span><span class="ico">📒</span><h2>Mi álbum de stickers</h2><p id="albumSub">Junta estrellas y desbloquea stickers.</p></button>
    </div>
    <p class="hint">Cada juego terminado te da estrellas ⭐</p>
    <div class="parents"><button class="linkbtn" id="parentsBtn">👨‍👩‍👧 Papás: desbloquear KIDU completo</button></div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="wrap" hidden>
    <div class="gamebar">
      <button class="round" id="backBtn" aria-label="Volver al menú">⬅️</button>
      <h2 id="gTitle">Juego</h2>
      <button class="round" id="sayBtn" aria-label="Escuchar instrucción">🗣️</button>
    </div>
    <div class="instr"><span id="gInstr"></span><div class="dots" id="gDots"></div></div>
    <div class="stage" id="stage"></div>
  </section>
</div>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const store = {
  get(k,d){ try{ const v=localStorage.getItem('patio_'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem('patio_'+k,JSON.stringify(v)); }catch(e){} }
};
const S = { age: store.get('age','peque'), stars: store.get('stars',0), sound: store.get('sound',true) };

/* ---------- sonido ---------- */
let ctx=null;
function ac(){ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }catch(e){} return ctx; }
function tone(freq,dur=.3,type='sine',vol=.22,when=0,slide=0){
  if(!S.sound) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);

GAMES.globos = { title:'Globos de colores', start(st,big){

  const target = names[rnd(names.length)], goal = big?10:6;

  const balloons=[];
  function spawn(){
    if(!alive) return;
    const col = Math.random()<.45 ? target : names[rnd(names.length)];
    const b=document.createElement('div'); b.className='balloon'; b.style.background=COLORS[col];
    const w=sky.clientWidth; const x=8+Math.random()*Math.max(10,w-90);
    const o={el:b,col,x,y:sky.clientHeight+20,v:(big?85:55)+Math.random()*(big?60:35),sway:Math.random()*6.28};
    b.style.left=x+'px'; b.style.transform=`translateY(${o.y}px)`;
    b.addEventListener('pointerdown',e=>{e.preventDefault(); hit(o);});
    sky.appendChild(b); balloons.push(o);
    spawnT=setTimeout(spawn, big?650:950);
  }
  function hit(o){
    if(o.dead||!alive) return;
    if(o.col===target){
      o.dead=true; sfx.pop(); got++; setDots(goal,got);
      const t=document.createElement('div'); t.className='burst'; t.textContent='¡POP!'; t.style.color=COLORS[target];
      t.style.left=o.x+'px'; t.style.top=o.y+'px'; sky.appendChild(t); setTimeout(()=>t.remove(),600);
      o.el.remove();
      if(got>=goal){ alive=false; setTimeout(()=>celebrate(big?3:2),500); }
    } else { sfx.oops(); o.el.classList.add('shake'); setTimeout(()=>o.el.classList.remove('shake'),350); say('Ese es '+o.col+'. Busca el '+target); }
  }
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    for(let i=balloons.length-1;i>=0;i--){ const o=balloons[i]; if(o.dead){balloons.splice(i,1);continue;}
      o.y-=o.v*dt; o.sway+=dt*2; o.el.style.transform=`translate(${Math.sin(o.sway)*8}px,${o.y}px)`;
      if(o.y<-140){ o.el.remove(); balloons.splice(i,1);} }
    if(alive) raf=requestAnimationFrame(loop);
  }
  spawn(); raf=requestAnimationFrame(loop);
  return { stop(){ alive=false; cancelAnimationFrame(raf); clearTimeout(spawnT); } };
}};

  st.append(modes,x,lyric);
  const bars=N.map(([n,f,c],i)=>{ const b=document.createElement('button'); b.className='bar'; b.style.background=COLORS[c];
    b.style.height=`clamp(${150-i*9}px, ${38-i*2.2}vw, ${250-i*14}px)`; b.innerHTML=`<i></i><span>${n}</span><i></i>`; b.setAttribute('aria-label',n);
    b.addEventListener('pointerdown',e=>{e.preventDefault(); play(i);}); x.appendChild(b); return b; });
  function ring(i){ tone(N[i][1],.9,'sine',.25); tone(N[i][1]*4,.15,'sine',.04); bars[i].classList.add('hit'); timers.push(setTimeout(()=>bars[i].classList.remove('hit'),120)); }
  function mark(){ bars.forEach(b=>b.classList.remove('next')); if(mode==='cancion'&&pos<song.length) bars[song[pos]].classList.add('next');
    lyric.innerHTML = mode==='cancion' ? WORDS.slice(0,song.length).map((w,i)=>i<pos?`<b>${w}</b>`:w).join(' ') : ''; }
  function play(i){ ring(i);
    if(mode!=='cancion'||pos>=song.length) return;
    if(i===song[pos]){ pos++; setDots(song.length,pos); mark(); if(pos===song.length) timers.push(setTimeout(()=>celebrate(big?3:2),900)); }
  }
  function setMode(m){ mode=m; pos=0; modes.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
    if(m==='libre'){ setInstr('Toca las barras y haz música','Toca las barras y haz tu propia música'); $('#gDots').innerHTML=''; }
    else { setInstr('Toca la barra que brilla ✨','Toca la barra que brilla para tocar Estrellita'); setDots(song.length,0);
      song.forEach((n,k)=>timers.push(setTimeout(()=>ring(n),300+k*380))); }
    mark(); }
  modes.addEventListener('click',e=>{ const b=e.target.closest('.mode'); if(b) setMode(b.dataset.m); });
  setMode('libre');
  return { stop(){ timers.forEach(clearTimeout); } };
}};

/* ---- motor de preguntas (números y letras) ---- */
function quiz(st,rounds,stars){
  let r=0, timers=[], lock=false;
  const box=document.createElement('div'); box.className='quiz'; st.appendChild(box);
  const optColors=[COLORS.azul,COLORS.rojo,COLORS.morado,COLORS.verde];
  setDots(rounds.length,0);
  function show(){
    const q=rounds[r]; lock=false;
    setInstr(q.instr,q.speech);
    box.innerHTML=`<div class="qshow">${q.show}</div>${q.word?`<div class="qword">${q.word}</div>`:''}<div class="opts"></div>`;
    const o=box.querySelector('.opts');
    q.opts.forEach((v,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=v; b.style.background=optColors[i%4];
      b.addEventListener('click',()=>pick(b,v,q)); o.appendChild(b); });
  }
  function pick(b,v,q){
    if(lock||b.classList.contains('no')) return;
    if(v===q.ans){ lock=true; b.classList.add('ok'); sfx.good(); say(q.yes);
      if(q.word) box.querySelector('.qword').innerHTML=q.full;
      r++; setDots(rounds.length,r);
      timers.push(setTimeout(()=> r>=rounds.length ? celebrate(stars) : show(), 1600));
    } else { b.classList.add('no','shake'); sfx.oops(); say(q.hint); }
  }
  show();
  return { stop(){ timers.forEach(clearTimeout); } };
}
function numOpts(ans,max){ const s=new Set([ans]); while(s.size<3){ const v=Math.max(1,Math.min(max,ans+rnd(5)-2)); s.add(v===ans?rnd(max)+1:v);} return shuffle([...s]); }

/* ---- 6. ¿Cuántos hay? ---- */
GAMES.numeros = { title:'¿Cuántos hay?', start(st,big){
  const F=[['🍎','manzanas',1],['🍌','bananos',0],['🍓','fresas',1],['🍊','naranjas',1],['🍇','racimos de uvas',0],['🥕','zanahorias',1],['🐟','pececitos',0],['⚽','pelotas',1]];
  const rounds=[];
  const n=big?6:5;
  for(let i=0;i<n;i++){
    const [e,name,fem]=F[rnd(F.length)]; const cu = fem?'Cuántas':'Cuántos';
    const one = (k,d=0)=>Array.from({length:k},(_,j)=>`<span class="one" style="animation-delay:${(j+d)*.06}s">${e}</span>`).join('');
    if(big && i>=3){ // sumas sencillas
      const a=1+rnd(5), b=1+rnd(4), ans=a+b;
      rounds.push({show:one(a)+'<span class="sum">+</span>'+one(b,a), opts:numOpts(ans,12), ans,
        instr:`¿Cuánto es ${a} + ${b}?`, speech:`${a} ${name} más ${b} ${name}. ¿${cu} son en total?`,
        yes:`¡Sí! ${a} más ${b} son ${ans}`, hint:'Cuenta todas otra vez, una por una'});
    } else {
      const ans=1+rnd(big?11:5);
      rounds.push({show:one(ans), opts:numOpts(ans,big?12:6), ans,
        instr:`¿${cu} ${name} hay?`, speech:`¿${cu} ${name} hay? Cuéntal${fem?'as':'os'}`,
        yes:`¡Sí! Hay ${ans}`, hint:'Cuenta otra vez con tu dedito'});
    }
  }
  return quiz(st,rounds,big?3:2);
}};

/* ---- 7. ¿Con qué letra? ---- */
GAMES.letras = { title:'¿Con qué letra empieza?', start(st,big){
  const VOC=[['🐝','ABEJA'],['🌳','ÁRBOL'],['🐘','ELEFANTE'],['⭐','ESTRELLA'],['🦎','IGUANA'],['🏝️','ISLA'],['🐻','OSO'],['👁️','OJO'],['🍇','UVAS'],['1️⃣','UNO']];
  const CON=[['🐱','GATO'],['🐶','PERRO'],['🐵','MONO'],['☀️','SOL'],['🌙','LUNA'],['🏠','CASA'],['🐢','TORTUGA'],['🐭','RATÓN'],['☁️','NUBE'],['⛵','BARCO'],['🌸','FLOR'],['🎲','DADO'],['🐸','RANA'],['🍉','SANDÍA']];
  const base = (w)=>w[0].normalize('NFD').replace(/[̀-ͯ]/g,'');
  const pool = big ? shuffle(CON.slice()).slice(0,6) : shuffle(VOC.slice()).slice(0,5);
  const letters = big ? [...new Set(CON.map(x=>base(x[1])))] : ['A','E','I','O','U'];
  const rounds = pool.map(([e,w])=>{
    const ans=base(w); const s=new Set([ans]);
    const sameSound={S:'CZ',C:'SZ',Z:'SC',B:'V',V:'B'}; // en Guatemala suenan igual
    const ok=letters.filter(l=>!(sameSound[ans]||'').includes(l));
    while(s.size<3) s.add(ok[rnd(ok.length)]);
    const low=w.charAt(0)+w.slice(1).toLowerCase();
    return {show:`<span class="one">${e}</span>`, word:`<span class="blank">?</span>${w.slice(1)}`, full:`<span class="blank">${w[0]}</span>${w.slice(1)}`,
      opts:shuffle([...s]), ans, instr:`¿Con qué letra empieza <b>${low}</b>?`, speech:`${low}. ¿Con qué letra empieza ${low}?`,
      yes:`¡Sí! ${low} empieza con ${ans}`, hint:`Escucha: ${low}`};
  });
  return quiz(st,rounds,big?3:2);
}};

/* ---- Álbum ---- */
GAMES.album = { title:'Mi álbum de stickers', start(st){
  const u=unlocked(S.stars), nx=STICKERS[u];
  setInstr(`Tienes <b>${u}</b> de ${STICKERS.length} stickers` + (nx?` · el próximo con ${nx[2]} ⭐`:''),
    `Tienes ${u} stickers. `+(nx?`Te faltan ${nx[2]-S.stars} estrellas para el siguiente`:'Los tienes todos. ¡Felicidades!'));
  const g=document.createElement('div'); g.className='album'; st.appendChild(g);
  STICKERS.forEach(([e,n,need],i)=>{ const d=document.createElement('button'); const on=S.stars>=need;
    d.className='stk'+(on?'':' lock'); d.innerHTML=`<span class="e">${e}</span><span class="n">${on?n:need+' ⭐'}</span>`;
    d.addEventListener('click',()=>{ if(on){ sfx.good(); say(n); d.classList.remove('new'); void d.offsetWidth; d.classList.add('new'); } else { sfx.flip(); say(`Necesitas ${need} estrellas`); } });
    g.appendChild(d); });
  return {};
}};
})();
